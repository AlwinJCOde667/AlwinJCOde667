<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#022c22"/><stop offset="1" stop-color="#082f49"/></linearGradient>
<style>
.h{font-family:'Segoe UI',Arial,sans-serif;fill:#fff;font-weight:700;font-size:26px}
.m{font-family:'Segoe UI',Arial,sans-serif;fill:#a7f3d0;font-size:15px}
.l{font-family:'Segoe UI',Arial,sans-serif;fill:#fff;font-size:12px;text-anchor:middle}
.w{transform-box:fill-box;transform-origin:center bottom;animation:w 1s ease-in-out infinite}
@keyframes w{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.fl{stroke-dasharray:8 6;animation:dash 1.5s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
.cur{animation:c 3s ease-in-out infinite}
@keyframes c{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-20px)}}
</style></defs>
<rect width="900" height="240" rx="18" fill="url(#g)"/>
<rect x="85" y="70" width="14" height="60" rx="7" fill="#34d399"/>
<g fill="#34d399"><rect class="w" x="40" y="75" width="8" height="70"/><rect class="w" x="55" y="75" width="8" height="70" style="animation-delay:.15s"/><rect class="w" x="70" y="75" width="8" height="70" style="animation-delay:.3s"/><rect class="w" x="100" y="75" width="8" height="70" style="animation-delay:.45s"/><rect class="w" x="115" y="75" width="8" height="70" style="animation-delay:.6s"/><rect class="w" x="130" y="75" width="8" height="70" style="animation-delay:.75s"/><rect class="w" x="145" y="75" width="8" height="70" style="animation-delay:.9s"/></g>
<text class="h" x="250" y="55">Accessibility Automation</text>
<text class="m" x="250" y="82">Voice-controlled computer interaction for people with motor disabilities</text>
<g transform="translate(250,105)">
<rect width="120" height="48" rx="10" fill="#059669"/><text class="l" x="60" y="29">🎤 Voice</text>
<rect x="160" width="140" height="48" rx="10" fill="#0d9488"/><text class="l" x="230" y="29">Speech-to-Text</text>
<rect x="340" width="130" height="48" rx="10" fill="#0e7490"/><text class="l" x="405" y="29">Command Parser</text>
<rect x="510" width="130" height="48" rx="10" fill="#1d4ed8"/><text class="l" x="575" y="29">Mouse • Keys • Apps</text>
<g stroke="#6ee7b7" stroke-width="2.5" class="fl"><line x1="120" y1="24" x2="160" y2="24"/><line x1="300" y1="24" x2="340" y2="24"/><line x1="470" y1="24" x2="510" y2="24"/></g>
</g>
<path class="cur" d="M790 150 L790 190 L800 181 L808 197 L814 194 L806 178 L819 178Z" fill="#fff"/>
<text class="m" x="250" y="215">Python • Google Speech-to-Text • Desktop Automation</text>
</svg>
