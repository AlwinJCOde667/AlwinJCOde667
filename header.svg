<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="0.5" stop-color="#1e3a8a"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
<linearGradient id="tx" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
<style>
.t{font-family:'Segoe UI',Arial,sans-serif;font-weight:800;font-size:68px;fill:url(#tx);letter-spacing:6px}
.s{font-family:'Segoe UI',Arial,sans-serif;font-size:20px;fill:#bae6fd;letter-spacing:3px}
.n{animation:fl 6s ease-in-out infinite}
.n2{animation:fl 8s ease-in-out infinite reverse}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.pulse{animation:p 2.4s ease-in-out infinite;transform-origin:center}
@keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
.fade{animation:f 1.6s ease both}
@keyframes f{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
</style>
</defs>
<rect width="1000" height="260" fill="url(#bg)"/>
<g stroke="#67e8f9" stroke-opacity=".55" stroke-width="1.2">
<g class="n"><line x1="80" y1="60" x2="200" y2="140"/><line x1="200" y1="140" x2="120" y2="210"/><line x1="200" y1="140" x2="330" y2="90"/>
<circle cx="80" cy="60" r="5" fill="#67e8f9"/><circle cx="200" cy="140" r="7" fill="#fff"/><circle cx="120" cy="210" r="5" fill="#67e8f9"/><circle cx="330" cy="90" r="5" fill="#67e8f9"/></g>
<g class="n2"><line x1="880" y1="50" x2="780" y2="130"/><line x1="780" y1="130" x2="900" y2="200"/><line x1="780" y1="130" x2="660" y2="190"/>
<circle cx="880" cy="50" r="5" fill="#67e8f9"/><circle cx="780" cy="130" r="7" fill="#fff"/><circle cx="900" cy="200" r="5" fill="#67e8f9"/><circle cx="660" cy="190" r="5" fill="#67e8f9"/></g>
</g>
<circle class="pulse" cx="500" cy="30" r="3" fill="#fff"/><circle class="pulse" cx="560" cy="235" r="3" fill="#fff" style="animation-delay:.8s"/><circle class="pulse" cx="430" cy="225" r="3" fill="#fff" style="animation-delay:1.4s"/>
<text class="t fade" x="500" y="125" text-anchor="middle">ALWIN JOHN</text>
<text class="s fade" x="500" y="170" text-anchor="middle" style="animation-delay:.4s">COMPUTER SCIENCE  •  AI / ML  •  DEVELOPER</text>
<rect x="380" y="190" width="240" height="3" rx="2" fill="#67e8f9"><animate attributeName="width" values="0;240;0" dur="5s" repeatCount="indefinite"/><animate attributeName="x" values="500;380;500" dur="5s" repeatCount="indefinite"/></rect>
</svg>
