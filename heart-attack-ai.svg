<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#450a0a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
<style>
.h{font-family:'Segoe UI',Arial,sans-serif;fill:#fff;font-weight:700;font-size:26px}
.m{font-family:'Segoe UI',Arial,sans-serif;fill:#fecaca;font-size:15px}
.b{font-family:'Segoe UI',Arial,sans-serif;fill:#fff;font-size:12px}
.heart{animation:beat 1.1s infinite;transform-origin:110px 120px}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
.ecg{stroke-dasharray:600;stroke-dashoffset:600;animation:d 2.8s linear infinite}
@keyframes d{to{stroke-dashoffset:-600}}
.bar{transform-origin:left;animation:gr 3s ease-out infinite alternate}
@keyframes gr{from{transform:scaleX(.2)}to{transform:scaleX(1)}}
</style></defs>
<rect width="900" height="240" rx="18" fill="url(#g)"/>
<path class="heart" d="M110 160 C50 115 60 70 90 70 C103 70 110 80 110 85 C110 80 117 70 130 70 C160 70 170 115 110 160Z" fill="#ef4444"/>
<polyline class="ecg" points="20,195 120,195 140,170 160,215 180,150 200,195 360,195" fill="none" stroke="#f87171" stroke-width="3"/>
<text class="h" x="250" y="55">Advanced Heart Attack Risk Prediction</text>
<text class="m" x="250" y="82">Stacked ensemble (SVM + Random Forest + KNN) • 8,763 patient records</text>
<g transform="translate(250,100)">
<rect width="300" height="14" rx="7" fill="#ffffff22"/><rect class="bar" width="260" height="14" rx="7" fill="#fb7185" style="animation-delay:0s"/><text class="b" x="310" y="12">Random Forest 88.04%</text>
<rect y="28" width="300" height="14" rx="7" fill="#ffffff22"/><rect class="bar" y="28" width="262" height="14" rx="7" fill="#f472b6" style="animation-delay:.3s"/><text class="b" x="310" y="40">Voting 88.59%</text>
<rect y="56" width="300" height="14" rx="7" fill="#ffffff22"/><rect class="bar" y="56" width="267" height="14" rx="7" fill="#fbbf24" style="animation-delay:.6s"/><text class="b" x="310" y="68">Stacking 89.13%  ★</text>
</g>
<text class="m" x="250" y="215">Python • Scikit-learn • Pandas • NumPy</text>
</svg>
